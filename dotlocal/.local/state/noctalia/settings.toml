wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "hyprland", "kitty", "niri", "qt", "umbriel" ]
    community_ids = [ "ytm-player", "pywalfox", "neovim" ]

[wallpaper]
directory = "/home/lune/Pictures/Wallpapers"
transition = [ "disc" ]

    [wallpaper.automation]
    enabled = true
    interval_seconds = 1200

    [wallpaper.default]
