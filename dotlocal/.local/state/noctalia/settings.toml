    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hooks]
started = "~/.config/noctalia/hooks/wallpaper_theme.sh"
wallpaper_changed = "~/.config/noctalia/hooks/wallpaper_theme.sh"

[location]
